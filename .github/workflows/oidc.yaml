name: OIDC Vault Secrets

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  oidc-vault:
    runs-on: ubuntu-22.04

    # Permissions required for OIDC authentication
    permissions:
      contents: read   # checkout repository
      id-token: write  # generate OIDC token

    steps:
      - name: Vault Login
        uses: hashicorp/vault-action@v2
        with:
          url: https://security.calvineotieno.com
          method: jwt
          role: gh-role-main
          path: github-actions
          exportToken: true
          exportEnv: true
          jwtGithubAudience: https://github.com/NYARAS
          secrets: |
              secrets/apps/data/demo DATABASE_NAME

      - name: Vault Token Lookup (using output)
        run: |
          set -e
          TOKEN="${{ steps.vault.outputs.token }}"
          curl -s \
            --header "X-Vault-Token: $TOKEN" \
            https://security.calvineotieno.com/v1/auth/token/lookup-self | jq .

      - name: Import Secrets From Vault Using Repo Specific Role
        id: import-secrets2
        uses: hashicorp/vault-action@v3
        with:
          url: https://security.calvineotieno.com
          method: jwt
          role: gh-role-main
          path: github-actions
          jwtGithubAudience: https://github.com/NYARAS
          secrets: |
              secrets/apps/data/demo  DATABASE_NAME

####################### Test Output #################################################
      - name: Show variables variables for testing
        run: |
          echo ${{ steps.import-secrets.outputs.DATABASE_NAME }} | sed 's/./& /g'
          echo ${{ steps.import-secrets2.outputs.DATABASE_NAME }} | sed 's/./& /g'