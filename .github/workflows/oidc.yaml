name: OIDC Vault Secrets

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  oidc-vault:
    runs-on: ubuntu-22.04

    # Permissions required for OIDC authentication
    permissions:
      contents: read   # checkout repository
      id-token: write  # generate OIDC token

    steps:
      - name: Vault Login
        uses: hashicorp/vault-action@v2
        with:
          url: https://security.calvineotieno.com
          method: jwt
          role: gh-role-main
          jwtGithubAudience: https://github.com/NYARAS
      - name: Get Secret
        run: |
          VAULT_TOKEN=$(cat .vault-token) # Or use the output from vault-action
          SECRET_VALUE=$(vault read -field=value secrets/apps/data/demo)
          echo "::add-mask::$SECRET_VALUE"
          echo "MY_SECRET=$SECRET_VALUE" >> $GITHUB_ENV