---
name: OIDC Vault Access

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  vault-secrets:
    runs-on: ubuntu-22.04

    permissions:
      contents: read   # checkout repository
      id-token: write  # generate OIDC token

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Authenticate with Vault using GitHub OIDC
      - name: Vault Login via GitHub OIDC
        id: vault_login
        uses: hashicorp/vault-action@v2.7.4
        with:
          url: https://security.calvineotieno.com
          method: jwt
          role: gh-role-main
          path: github-actions
          exportEnv: true   # Export VAULT_TOKEN to environment
          outputToken: true # Save token in step outputs
        # Fail immediately if authentication fails
        continue-on-error: false

      # Lookup Vault token to ensure it is valid
      - name: Verify Vault Token
        id: vault_lookup
        uses: hashicorp/vault-action@v2.7.4
        with:
          url: https://security.calvineotieno.com
          method: token
          token: ${{ steps.vault_login.outputs.token }}
          path: auth/token/lookup
        continue-on-error: false

      # Fetch secret(s) from Vault
      - name: Fetch Vault Secrets
        id: import_secrets
        uses: hashicorp/vault-action@v2.7.4
        with:
          url: https://security.calvineotieno.com
          method: jwt
          role: gh-role-main
          path: github-actions
          exportEnv: true
          secrets: |
            secrets/apps/data/demo  DATABASE_PASSWORD | DATABASE_PASSWORD
        continue-on-error: false

      # Fail if the secret was not set
      - name: Validate Secrets
        run: |
          if [ -z "${DATABASE_PASSWORD}" ]; then
            echo "ERROR: DATABASE_PASSWORD is missing from Vault!"
            exit 1
          fi
          echo "Successfully fetched DATABASE_PASSWORD from Vault"

      # Optional: Export secrets to a JSON file
      - name: Export secrets to JSON
        run: |
          echo '{"DATABASE_PASSWORD":"'"$DATABASE_PASSWORD"'"}' > secrets.json
          cat secrets.json
